<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ site.name }}{% endblock %}</title>
<meta name="description" content="{% block description %}{{ site.description }}{% endblock %}">
<link rel="alternate" type="application/rss+xml" title="{{ site.name }}" href="/feed.xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<script>
  // Apply the saved theme before paint so there's no flash
  try { var t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<header class="site-header">
  <div class="wrap bar">
    <a class="logo" href="/">{{ site.logo }}<span>{{ site.logo_suffix }}</span></a>
    <nav aria-label="Main">
      <a href="/blog/" {% if nav == "blog" %}aria-current="page"{% endif %}>Writing</a>
      {% if site.show_projects %}<a href="/projects/" {% if nav == "projects" %}aria-current="page"{% endif %}>Projects</a>{% endif %}
      <a href="/about/" {% if nav == "about" %}aria-current="page"{% endif %}>About</a>
      {% if site.links.resume %}<a href="{{ site.links.resume }}">Résumé</a>{% endif %}
      <a href="/contact/" {% if nav == "contact" %}aria-current="page"{% endif %}>Contact</a>
      <button type="button" class="theme-toggle" aria-label="Toggle dark mode">
        <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </nav>
  </div>
</header>

<main class="{% block main_class %}wrap{% endblock %}">
{% block content %}{% endblock %}
</main>

<footer class="site-footer">
  <div class="wrap bar">
    <span>© {{ year }} {{ site.name }}</span>
    <span class="links">
      <a href="{{ site.links.github }}">GitHub</a>
      <a href="{{ site.links.linkedin }}">LinkedIn</a>
      <a href="/contact/">Contact</a>
      <a href="/feed.xml">RSS</a>
    </span>
  </div>
</footer>
<script src="/static/site.js"></script>
</body>
</html>
